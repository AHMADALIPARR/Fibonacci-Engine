name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Policy check
        run: ruby scripts/check_policy.rb

      - name: Install the Ruby GUI host
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ruby ruby-gtk3 xvfb imagemagick fonts-dejavu-core

      - name: Render the Fibonacci and helix panels
        run: |
          set -eu
          OUT=pages-render
          mkdir -p "$OUT"
          DISP=:95
          Xvfb "$DISP" -screen 0 1400x900x24 -nolisten tcp >"$OUT/xvfb.log" 2>&1 &
          XPID=$!
          trap 'kill $XPID 2>/dev/null || true' EXIT
          sleep 1
          export DISPLAY="$DISP"
          shot() {
            name=$1
            panel=$2
            actions=$3
            log="$OUT/$name.log"
            ruby ruby/application/morphic_helix.rb --panel "$panel" --actions "$actions" \
              --dump-state "$OUT/$name.state.json" --quit-after 600000 >"$log" 2>&1 &
            app=$!
            i=0
            until grep -q '^state dumped' "$log" 2>/dev/null; do
              i=$((i + 1))
              if [ "$i" -gt 240 ] || ! kill -0 "$app" 2>/dev/null; then
                echo "FAIL $name"
                cat "$log" || true
                exit 1
              fi
              sleep 0.25
            done
            sleep 0.6
            import -display "$DISP" -window root "$OUT/$name.png"
            kill "$app" 2>/dev/null || true
            wait "$app" 2>/dev/null || true
            echo "OK $name"
          }
          shot 01-fibonacci fibonacci 'set:fib-depth=7'
          shot 02-helix helix 'click:btn-braid-forward,click:btn-braid-inverse,click:btn-helix-next,click:btn-helix-next,click:btn-helix-zoom-in'

      - name: Assemble the static site
        run: |
          ruby <<'RUBY'
          require 'fileutils'
          site = '_site'
          FileUtils.rm_rf(site)
          FileUtils.mkdir_p(site)
          %w[01-fibonacci 02-helix].each do |name|
            FileUtils.cp("pages-render/#{name}.png", "#{site}/#{name}.png")
            FileUtils.cp("pages-render/#{name}.state.json", "#{site}/#{name}.state.json")
          end
          File.write("#{site}/index.html", <<~HTML)
            <!DOCTYPE html>
            <html lang="en">
            <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Morphic Helix</title>
            <style>
              html, body { margin: 0; background: #000; color: #e6e9ef; }
              main { display: flex; flex-wrap: wrap; }
              figure { margin: 0; flex: 1 1 480px; }
              img { width: 100%; height: auto; display: block; background: #1b1f27; }
              figcaption { font: 14px/1.4 sans-serif; padding: 10px 12px; }
            </style>
            </head>
            <body>
            <main>
              <figure>
                <figcaption>Fibonacci</figcaption>
                <img src="01-fibonacci.png" alt="Fibonacci panel of the Morphic Helix GUI">
              </figure>
              <figure>
                <figcaption>DNA Helix — braid</figcaption>
                <img src="02-helix.png" alt="DNA helix and braid panel of the Morphic Helix GUI">
              </figure>
            </main>
            </body>
            </html>
          HTML
          RUBY

      - name: Upload site preview
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: _site
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
